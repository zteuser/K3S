apiVersion: apps/v1
kind: Deployment
metadata:
  name: portainer-agent
  namespace: portainer-agent
  labels:
    app: portainer-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: portainer-agent
  template:
    metadata:
      labels:
        app: portainer-agent
    spec:
      serviceAccountName: portainer-agent
      # Без hostNetwork — стабільніший Service/Endpoints; DNS через дозвольні політики (allow-agent-dns-any).
      # Запускати на тій самій ноді, що й Portainer (master-node)
      nodeSelector:
        kubernetes.io/hostname: master-node
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
      - name: portainer-agent
        image: portainer/agent:latest
        imagePullPolicy: Always
        env:
        # Якщо на Portainer Server задано Agent secret, вкажіть той самий тут (або через valueFrom secretKeyRef).
        # - name: AGENT_SECRET
        #   value: "your-agent-secret"
        - name: KUBERNETES_POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: KUBERNETES_POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: KUBERNETES_NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: KUBERNETES_POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        ports:
        - containerPort: 9001
          name: http
          protocol: TCP
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "200m"
