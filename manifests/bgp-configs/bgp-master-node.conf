! BGP configuration for Amper master-node (k3s master)
! Router ID: 10.0.10.10 | AS: 65001
! Neighbors: worker (10.0.10.20), Syhiv17 (192.168.100.2), VRN625 (192.168.100.6)
! Interfaces: enp0s6 (OCI 10.0.10.0/24), wg0 (192.168.100.1/30), wg1 (192.168.100.5/30)
!
frr version 9.1
frr defaults traditional
hostname master-node
log syslog informational
service integrated-vtysh-config
!
ip forwarding
!
router bgp 65001
 bgp router-id 10.0.10.10
 no bgp default ipv4-unicast
 bgp graceful-restart
 bgp cluster-id 0.0.0.1
 neighbor 10.0.10.20 remote-as 65001
 neighbor 10.0.10.20 description worker-enp0s6
 neighbor 10.0.10.20 timers 5 15
 neighbor 192.168.100.2 remote-as 65001
 neighbor 192.168.100.2 description Syhiv17-wgclt1
 neighbor 192.168.100.2 timers 5 15
 neighbor 192.168.100.6 remote-as 65001
 neighbor 192.168.100.6 description VRN625-wgclt1
 neighbor 192.168.100.6 timers 5 15
 !
 address-family ipv4 unicast
  network 10.0.10.10/32
  network 10.0.10.0/24
  network 192.168.100.0/30
  network 192.168.100.4/30
  neighbor 10.0.10.20 route-reflector-client
  neighbor 10.0.10.20 activate
  neighbor 10.0.10.20 soft-reconfiguration inbound
  neighbor 192.168.100.2 route-reflector-client
  neighbor 192.168.100.2 activate
  neighbor 192.168.100.2 soft-reconfiguration inbound
  neighbor 192.168.100.6 route-reflector-client
  neighbor 192.168.100.6 activate
  neighbor 192.168.100.6 soft-reconfiguration inbound
 exit-address-family
!
exit
