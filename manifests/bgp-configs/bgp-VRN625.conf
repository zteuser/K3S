! BGP configuration for VRN625 (UCG) — upload via UniFi Settings → Routing → BGP
! Router ID: 192.168.2.1 | AS: 65001
! Neighbors: master (192.168.100.5 wgclt1), worker (192.168.200.5 wgclt2)
! Route-maps MUST be defined before router bgp (FRR parses top-to-bottom).
!
route-map FROM-MASTER permit 10
 set local-preference 200
exit
!
route-map FROM-WORKER permit 10
 set local-preference 100
exit
!
router bgp 65001
 bgp router-id 192.168.2.1
 no bgp default ipv4-unicast
 bgp graceful-restart
 neighbor 192.168.100.5 remote-as 65001
 neighbor 192.168.100.5 description Amper-master-wg1
 neighbor 192.168.100.5 timers 5 15
 neighbor 192.168.100.5 route-map FROM-MASTER in
 neighbor 192.168.200.5 remote-as 65001
 neighbor 192.168.200.5 description Amper-worker-wg1
 neighbor 192.168.200.5 timers 5 15
 neighbor 192.168.200.5 route-map FROM-WORKER in
 !
 address-family ipv4 unicast
  network 192.168.2.0/24
  network 192.168.100.4/30
  network 192.168.200.4/30
  neighbor 192.168.100.5 activate
  neighbor 192.168.100.5 soft-reconfiguration inbound
  neighbor 192.168.200.5 activate
  neighbor 192.168.200.5 soft-reconfiguration inbound
 exit-address-family
!
exit
