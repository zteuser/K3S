! BGP configuration for Syhiv17 (UCG) — upload via UniFi Settings → Routing → BGP
! Router ID: 192.168.1.1 | AS: 65001
! Neighbors: master (192.168.100.1 wgclt1), worker (192.168.200.1 wgclt2)
! Route-maps MUST be defined before router bgp (FRR parses top-to-bottom).
!
route-map FROM-MASTER permit 10
 set local-preference 200
exit
!
route-map FROM-WORKER permit 10
 set local-preference 100
exit
!
router bgp 65001
 bgp router-id 192.168.1.1
 no bgp default ipv4-unicast
 bgp graceful-restart
 neighbor 192.168.100.1 remote-as 65001
 neighbor 192.168.100.1 description Amper-master-wg0
 neighbor 192.168.100.1 timers 5 15
 neighbor 192.168.100.1 route-map FROM-MASTER in
 neighbor 192.168.200.1 remote-as 65001
 neighbor 192.168.200.1 description Amper-worker-wg0
 neighbor 192.168.200.1 timers 5 15
 neighbor 192.168.200.1 route-map FROM-WORKER in
 !
 address-family ipv4 unicast
  network 192.168.1.0/24
  network 192.168.100.0/30
  network 192.168.200.0/30
  neighbor 192.168.100.1 activate
  neighbor 192.168.100.1 soft-reconfiguration inbound
  neighbor 192.168.200.1 activate
  neighbor 192.168.200.1 soft-reconfiguration inbound
 exit-address-family
!
exit
