! BGP configuration for Amper work-node (k3s worker)
! Router ID: 10.0.10.20 | AS: 65001
! Neighbors: master (10.0.10.10), Syhiv17 (192.168.200.2), VRN625 (192.168.200.6)
! Interfaces: enp0s6 (OCI 10.0.10.0/24), wg0 (192.168.200.1/30), wg1 (192.168.200.5/30)
!
frr version 9.1
frr defaults traditional
hostname amper-worker
log syslog informational
service integrated-vtysh-config
!
ip forwarding
!
router bgp 65001
 bgp router-id 10.0.10.20
 no bgp default ipv4-unicast
 bgp graceful-restart
 bgp cluster-id 0.0.0.1
 neighbor 10.0.10.10 remote-as 65001
 neighbor 10.0.10.10 description master-enp0s6
 neighbor 10.0.10.10 timers 5 15
 neighbor 192.168.200.2 remote-as 65001
 neighbor 192.168.200.2 description Syhiv17-wgclt2
 neighbor 192.168.200.2 timers 5 15
 neighbor 192.168.200.6 remote-as 65001
 neighbor 192.168.200.6 description VRN625-wgclt2
 neighbor 192.168.200.6 timers 5 15
 !
 address-family ipv4 unicast
  network 10.0.10.20/32
  network 10.0.10.0/24
  network 192.168.200.0/30
  network 192.168.200.4/30
  neighbor 10.0.10.10 route-reflector-client
  neighbor 10.0.10.10 activate
  neighbor 10.0.10.10 soft-reconfiguration inbound
  neighbor 192.168.200.2 route-reflector-client
  neighbor 192.168.200.2 activate
  neighbor 192.168.200.2 soft-reconfiguration inbound
  neighbor 192.168.200.6 route-reflector-client
  neighbor 192.168.200.6 activate
  neighbor 192.168.200.6 soft-reconfiguration inbound
 exit-address-family
!
exit
