apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: monitoring

resources:
  # Namespace
  - namespace.yaml
  
  # Node Exporter
  - node-exporter/service.yaml
  - node-exporter/daemonset.yaml
  
  # Kube-state-metrics
  - kube-state-metrics/serviceaccount.yaml
  - kube-state-metrics/clusterrole.yaml
  - kube-state-metrics/clusterrolebinding.yaml
  - kube-state-metrics/deployment.yaml
  - kube-state-metrics/service.yaml
  
  # Prometheus
  - prometheus/serviceaccount.yaml
  - prometheus/clusterrole.yaml
  - prometheus/clusterrolebinding.yaml
  - prometheus/configmap.yaml
  - prometheus/pvc.yaml
  - prometheus/deployment.yaml
  - prometheus/service.yaml
  - prometheus/ingress.yaml
  
  # Grafana
  - grafana/configmap.yaml
  - grafana/configmap-datasources.yaml
  - grafana/configmap-dashboards.yaml
  - grafana/secret.yaml
  - grafana/pvc.yaml
  - grafana/deployment.yaml
  - grafana/service.yaml
  # Стандартний Ingress — k3s Traefik за замовчуванням обробляє саме Ingress (не IngressRoute CRD).
  # Якщо monitoring.lan повертає 404, застосуйте цей манифест і перезавантажте Traefik.
  - grafana/ingress.yaml
  # IngressRoute: вимкнено — CRD traefik.io/v1alpha1 не встановлено (Cilium замість Traefik).
  # - grafana/ingressroute.yaml

  # snmp-exporter (SNMP метрики роутерів) — Prometheus scrape target
  - snmp-exporter/configmap.yaml
  - snmp-exporter/secret.yaml
  - snmp-exporter/deployment.yaml
  - snmp-exporter/service.yaml

  # Loki (логи) — namespace monitoring, окремий volume 10Gi ocfs2-shared
  - loki/persistentvolume.yaml
  - loki/pvc.yaml
  - loki/configmap.yaml
  - loki/deployment.yaml
  - loki/service.yaml

  # Promtail (збір логів подів + journal) — DaemonSet на кожній ноді
  #- promtail/serviceaccount.yaml
  #- promtail/clusterrole.yaml
  #- promtail/clusterrolebinding.yaml
  #- promtail/configmap.yaml
  #- promtail/daemonset.yaml
  #- promtail/service.yaml

  # Alloy (заміна Promtail для логів у Loki; можна деплоїти поруч для тесту, потім вимкнути Promtail)
  - alloy/serviceaccount.yaml
  - alloy/clusterrole.yaml
  - alloy/clusterrolebinding.yaml
  - alloy/configmap.yaml
  - alloy/daemonset.yaml
  - alloy/service.yaml

# Не використовуємо commonLabels: вони додають мітки до spec.selector у Deployment/DaemonSet,
# а selector незмінний після створення — apply падає з "field is immutable" на вже створених ресурсах.
