apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-providers
  namespace: monitoring
  labels:
    app: grafana
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: 'snmp'
        orgId: 1
        folder: 'SNMP'
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /etc/grafana/provisioning/dashboards-json

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-json
  namespace: monitoring
  labels:
    app: grafana
data:
  snmp-routers.json: |
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": {
              "type": "grafana",
              "uid": "-- Grafana --"
            },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 0,
      "id": null,
      "links": [],
      "panels": [
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [
                {
                  "options": {
                    "0": {
                      "text": "DOWN"
                    },
                    "1": {
                      "text": "UP"
                    }
                  },
                  "type": "value"
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              },
              "unit": "none"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 5,
            "w": 8,
            "x": 0,
            "y": 0
          },
          "id": 1,
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "value"
          },
          "pluginVersion": "10.2.2",
          "targets": [
            {
              "editorMode": "code",
              "expr": "up{job=\"snmp-routers\", router_name=~\"$router\"}",
              "legendFormat": "{{router_name}} ({{instance}})",
              "range": true,
              "refId": "A"
            }
          ],
          "repeat": "router",
          "repeatDirection": "h",
          "title": "Router availability (UP/DOWN)",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "h"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 5,
            "w": 8,
            "x": 8,
            "y": 0
          },
          "id": 2,
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "value"
          },
          "pluginVersion": "10.2.2",
          "targets": [
            {
              "editorMode": "code",
              "expr": "sysUpTime{job=\"snmp-routers\", router_name=~\"$router\"} / 360000",
              "legendFormat": "{{router_name}}",
              "range": true,
              "refId": "A"
            }
          ],
          "repeat": "router",
          "repeatDirection": "h",
          "title": "Uptime (hours)",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "bps"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 5,
            "w": 8,
            "x": 16,
            "y": 0
          },
          "id": 3,
          "options": {
            "legend": {
              "calcs": [
                "lastNotNull"
              ],
              "displayMode": "table",
              "placement": "right",
              "showLegend": true
            },
            "tooltip": {
              "mode": "single",
              "sort": "none"
            }
          },
          "pluginVersion": "10.2.2",
          "targets": [
            {
              "editorMode": "code",
              "expr": "topk(10, rate(ifHCInOctets{job=\"snmp-routers\", router_name=~\"$router\"}[5m]) * 8) * on(instance, ifIndex) group_left(ifDescr) ifDescr{job=\"snmp-routers\", router_name=~\"$router\"}",
              "legendFormat": "in {{ifDescr}}",
              "range": true,
              "refId": "A"
            },
            {
              "editorMode": "code",
              "expr": "topk(10, rate(ifHCOutOctets{job=\"snmp-routers\", router_name=~\"$router\"}[5m]) * 8) * on(instance, ifIndex) group_left(ifDescr) ifDescr{job=\"snmp-routers\", router_name=~\"$router\"}",
              "legendFormat": "out {{ifDescr}}",
              "range": true,
              "refId": "B"
            }
          ],
          "repeat": "router",
          "repeatDirection": "h",
          "title": "Top interface traffic (bps) — ifHC* counters",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "ops"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 5
          },
          "id": 4,
          "options": {
            "legend": {
              "calcs": [
                "lastNotNull"
              ],
              "displayMode": "table",
              "placement": "right",
              "showLegend": true
            },
            "tooltip": {
              "mode": "single",
              "sort": "none"
            }
          },
          "pluginVersion": "10.2.2",
          "targets": [
            {
              "editorMode": "code",
              "expr": "topk(10, rate(ifInErrors{job=\"snmp-routers\", router_name=~\"$router\"}[5m])) * on(instance, ifIndex) group_left(ifDescr) ifDescr{job=\"snmp-routers\", router_name=~\"$router\"}",
              "legendFormat": "inErrors {{ifDescr}}",
              "range": true,
              "refId": "A"
            },
            {
              "editorMode": "code",
              "expr": "topk(10, rate(ifOutErrors{job=\"snmp-routers\", router_name=~\"$router\"}[5m])) * on(instance, ifIndex) group_left(ifDescr) ifDescr{job=\"snmp-routers\", router_name=~\"$router\"}",
              "legendFormat": "outErrors {{ifDescr}}",
              "range": true,
              "refId": "B"
            }
          ],
          "repeat": "router",
          "repeatDirection": "h",
          "title": "Top interface errors (per second)",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 5
          },
          "id": 5,
          "options": {
            "legend": {
              "calcs": [
                "lastNotNull"
              ],
              "displayMode": "table",
              "placement": "right",
              "showLegend": true
            },
            "tooltip": {
              "mode": "single",
              "sort": "none"
            }
          },
          "pluginVersion": "10.2.2",
          "targets": [
            {
              "editorMode": "code",
              "expr": "ifOperStatus{job=\"snmp-routers\", router_name=~\"$router\"} * on(instance, ifIndex) group_left(ifDescr) ifDescr{job=\"snmp-routers\", router_name=~\"$router\"}",
              "legendFormat": "{{ifDescr}} operStatus",
              "range": true,
              "refId": "A"
            }
          ],
          "repeat": "router",
          "repeatDirection": "h",
          "title": "Interface oper status (1=up, 2=down)",
          "type": "timeseries"
        }
      ],
      "refresh": "30s",
      "schemaVersion": 38,
      "style": "dark",
      "tags": [
        "snmp",
        "routers",
        "unifi",
        "edgerouter"
      ],
      "templating": {
        "list": [
          {
            "current": {
              "selected": false,
              "text": "Prometheus",
              "value": "Prometheus"
            },
            "hide": 0,
            "includeAll": false,
            "label": "Datasource",
            "multi": false,
            "name": "DS_PROMETHEUS",
            "options": [],
            "query": "prometheus",
            "refresh": 1,
            "regex": "",
            "skipUrlSync": false,
            "type": "datasource"
          },
          {
            "current": {
              "selected": false,
              "text": "vrn625 + syhiv17",
              "value": [
                "vrn625",
                "syhiv17"
              ]
            },
            "datasource": {
              "type": "prometheus",
              "uid": "${DS_PROMETHEUS}"
            },
            "definition": "label_values(up{job=\"snmp-routers\"}, router_name)",
            "hide": 0,
            "includeAll": false,
            "label": "Routers",
            "multi": true,
            "name": "router",
            "options": [],
            "query": {
              "query": "label_values(up{job=\"snmp-routers\"}, router_name)",
              "refId": "PrometheusVariableQueryEditor-VariableQuery"
            },
            "refresh": 2,
            "regex": "",
            "skipUrlSync": false,
            "sort": 1,
            "type": "query"
          }
        ]
      },
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "timepicker": {},
      "timezone": "browser",
      "title": "SNMP Routers (vrn625 / syhiv17)",
      "uid": "snmp-routers",
      "version": 1,
      "weekStart": ""
    }

