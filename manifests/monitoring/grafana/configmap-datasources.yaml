apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: monitoring
  labels:
    app: grafana
data:
  prometheus.yaml: |
    apiVersion: 1
    datasources:
    - name: Prometheus
      uid: prometheus
      type: prometheus
      access: proxy
      # NOTE:
      # If Grafana pod can't resolve cluster DNS (e.g. "lookup prometheus: i/o timeout"),
      # replace the URL with the Prometheus Service ClusterIP.
      #
      # Find it with:
      #   k3s kubectl -n monitoring get svc prometheus -o wide
      #
      # Example:
      #   url: http://10.43.x.y:9090
      url: http://prometheus:9090
      isDefault: true
      editable: true
      jsonData:
        timeInterval: "15s"
  # UID, які очікують імпортовані дашборди (наприклад kube-state-metrics-v2). Різні версії/імпорти можуть використовувати 82093 або B2093.
  prometheus-legacy.yaml: |
    apiVersion: 1
    datasources:
    - name: Prometheus (legacy)
      uid: PBFA97CFB59082093
      type: prometheus
      access: proxy
      url: http://prometheus:9090
      isDefault: false
      editable: false
      jsonData:
        timeInterval: "15s"
    - name: Prometheus (legacy B)
      uid: PBFA97CFB590B2093
      type: prometheus
      access: proxy
      url: http://prometheus:9090
      isDefault: false
      editable: false
      jsonData:
        timeInterval: "15s"
    # Promtail Monitoring dashboard (grafana.com)
    - name: Prometheus (legacy P8E80)
      uid: P8E80F9AEF21F6940
      type: prometheus
      access: proxy
      url: http://prometheus:9090
      isDefault: false
      editable: false
      jsonData:
        timeInterval: "15s"
    - name: Prometheus (legacy PBEB0)
      uid: PBEB0F9AEF21F6940
      type: prometheus
      access: proxy
      url: http://prometheus:9090
      isDefault: false
      editable: false
      jsonData:
        timeInterval: "15s"
  loki.yaml: |
    apiVersion: 1
    datasources:
    - name: Loki
      uid: loki
      type: loki
      access: proxy
      url: http://loki:3100
      isDefault: false
      editable: true
      jsonData:
        maxLines: 1000