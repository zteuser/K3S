# PV для Prometheus (10 ГіБ) — hostPath на sharedata1
apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv-prometheus-data
  labels:
    type: ocfs2
    app: prometheus
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ocfs2-shared
  hostPath:
    path: /sharedata1/prometheus
    type: DirectoryOrCreate
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: kubernetes.io/hostname
          operator: In
          values:
          - master-node
          - work-node
