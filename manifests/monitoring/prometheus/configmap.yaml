apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
  labels:
    app: prometheus
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
      external_labels:
        cluster: 'k3s-cluster'
        replica: 'prometheus-0'

    scrape_configs:
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']

      # API server metrics — через Service (не залежить від ноди; 192.168.2.19:6443 → connection refused)
      - job_name: 'kubernetes-apiservers'
        static_configs:
          - targets: ['kubernetes.default.svc.cluster.local:443']
        scheme: https
        metrics_path: /metrics
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          # k3s API cert може бути для apiserver, не kubernetes.default.svc
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token

      - job_name: 'kubernetes-nodes'
        static_configs:
          # master-node, work-node, macmini7, beelinkeqr5(192.168.1.19) — при додаванні ноди додайте її IP:10250
          - targets: ['10.0.10.10:10250', '10.0.10.20:10250', '192.168.2.19:10250', '192.168.1.19:10250']
        scheme: https
        tls_config:
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token

      - job_name: 'node-exporter'
        static_configs:
          # master-node, work-node, macmini7, beelinkeqr5(192.168.1.19) — при додаванні ноди додайте її IP:9100
          - targets: ['10.0.10.10:9100', '10.0.10.20:9100', '192.168.2.19:9100', '192.168.1.19:9100']

      # cAdvisor через API server proxy (bearer token приймається; для прямого scrape по IP у k3s часто DOWN)
      - job_name: 'cadvisor'
        kubernetes_sd_configs:
          - role: node
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        relabel_configs:
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/$1/proxy/metrics/cadvisor
          - target_label: __address__
            replacement: kubernetes.default.svc.cluster.local:443
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: node
            replacement: $1
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: instance
            replacement: $1
        scrape_interval: 30s
        scrape_timeout: 20s

      - job_name: 'kube-state-metrics'
        static_configs:
          # Service замість статичної IP пода — target залишається UP після перезапуску пода
          - targets: ['kube-state-metrics.monitoring.svc.cluster.local:8080']
        metrics_path: /metrics
        scrape_interval: 60s
        scrape_timeout: 55s   # має бути <= scrape_interval

      # Promtail — метрики для дашборду Grafana 20881 (Promtail Monitoring - Metrics and Logs)
      - job_name: 'promtail'
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names: [monitoring]
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_label_app]
            regex: promtail
            action: keep
          - source_labels: [__meta_kubernetes_endpoint_port_name]
            regex: http
            action: keep
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: instance
          - source_labels: [__meta_kubernetes_pod_ip]
            target_label: __address__
            replacement: $1:9080
          - target_label: job
            replacement: promtail
        scrape_interval: 30s
        scrape_timeout: 10s

      # Alloy — по одному таргету на ноду (DaemonSet). Метрики з усіх нод для дашбордів.
      # Щоб усі таргети були UP — потрібна cross-node доступність (POD_CONNECTIVITY_FIX_10_244.md).
      - job_name: 'alloy'
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names: [monitoring]
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_label_app]
            regex: alloy
            action: keep
          - source_labels: [__meta_kubernetes_endpoint_port_name]
            regex: http
            action: keep
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: instance
          - source_labels: [__meta_kubernetes_pod_ip]
            target_label: __address__
            replacement: $1:12345
          - target_label: job
            replacement: alloy
        scrape_interval: 30s
        scrape_timeout: 15s

      # SNMP Exporter для моніторингу роутерів
      - job_name: 'snmp-routers'
        scrape_interval: 60s  # Інтервал опитування роутерів (60 секунд)
        scrape_timeout: 60s  # Збільшено timeout для SNMP запитів
        static_configs:
          # Роутер vrn625 (UCG Ultra with UniFi OS)
          - targets:
            - 192.168.2.1
            labels:
              router_name: 'vrn625'
              router_ip: '192.168.2.1'
              router_model: 'UCG-Ultra'
              router_type: 'UniFi-OS'
          # Роутер syhiv17 (EdgeRouter-X)
          - targets:
            - 192.168.1.1
            labels:
              router_name: 'syhiv17'
              router_ip: '192.168.1.1'
              router_model: 'EdgeRouter-X'
              router_type: 'EdgeOS'
        metrics_path: /snmp
        params:
          module: [router]
          auth: [public_v2]
        relabel_configs:
          - source_labels: [__address__]
            target_label: __param_target
          # Використовуємо специфічний модуль для кожного роутера
          - source_labels: [router_name]
            target_label: __param_module
            regex: vrn625
            replacement: unifi_ucg
          - source_labels: [router_name]
            regex: syhiv17
            target_label: __param_module
            replacement: edgerouter_x
          - source_labels: [__param_target]
            target_label: instance
          - target_label: __address__
            # Use FQDN to avoid reliance on search domains
            replacement: snmp-exporter.monitoring.svc.cluster.local:9116

      # Victron MultiPlus (BLE Instant Readout → victron_prometheus_exporter на хості beelinkeqr5)
      - job_name: 'victron-inverter'
        static_configs:
          - targets: ['192.168.1.19:9091']
            labels:
              node: 'beelinkeqr5'
              device: 'victron-multiplus'
        scrape_interval: 60s
        scrape_timeout: 25s

      # Cilium — agent (порт 9962 з Cilium 1.14+; для старих версій — 9090), operator, hubble-relay
      - job_name: 'cilium-agent'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [kube-system]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_k8s_app]
            action: keep
            regex: cilium
          - source_labels: [__meta_kubernetes_pod_container_name]
            action: keep
            regex: cilium-agent
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: node
          - source_labels: [__meta_kubernetes_pod_ip]
            regex: (.+)
            target_label: __address__
            replacement: $1:9962
        scrape_interval: 15s
        scrape_timeout: 10s

      - job_name: 'cilium-operator'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [kube-system]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_io_cilium_app]
            action: keep
            regex: operator
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: node
          - source_labels: [__meta_kubernetes_pod_ip]
            regex: (.+)
            target_label: __address__
            replacement: $1:9963
        scrape_interval: 15s
        scrape_timeout: 10s

      # hubble-relay: порт метрик у Cilium 1.19 — 9966 (не 9965)
      - job_name: 'hubble-relay'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [kube-system]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            action: keep
            regex: hubble-relay
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: node
          - source_labels: [__meta_kubernetes_pod_ip]
            regex: (.+)
            target_label: __address__
            replacement: $1:9966
        scrape_interval: 15s
        scrape_timeout: 10s
