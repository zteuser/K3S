apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: monitoring
  labels:
    app: loki
data:
  loki.yaml: |
    auth_enabled: false

    server:
      http_listen_port: 3100
      grpc_listen_port: 9096
      log_level: info
      grpc_server_max_concurrent_streams: 1000

    common:
      instance_addr: 127.0.0.1
      path_prefix: /loki
      storage:
        filesystem:
          chunks_directory: /loki/chunks
          rules_directory: /loki/rules
      replication_factor: 1
      ring:
        kvstore:
          store: inmemory

    query_range:
      results_cache:
        cache:
          embedded_cache:
            enabled: true
            max_size_mb: 100

    limits_config:
      retention_period: 168h   # 7 днів
      reject_old_samples: false
      reject_old_samples_max_age: 168h   # приймати записи до 7 днів (backlog після простою Loki)
    ingester:
      # Вікно out-of-order = max_chunk_age/2. Якщо стрим вже має новіші записи, старі відхиляються з "entry too far behind".
      # 24h → вікно 12h, щоб приймати backlog після простою Loki/Promtail (напр. журнали з macmini7).
      max_chunk_age: 24h

    schema_config:
      configs:
        - from: "2020-10-24"
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h

    storage_config:
      filesystem:
        directory: /loki/chunks

    compactor:
      working_directory: /loki/compactor

    ruler:
      rule_path: /loki/rules
      alertmanager_url: http://localhost:9093
      storage:
        type: local

    frontend:
      encoding: protobuf

    # Вимкнути аналітику Grafana Labs (опціонально)
    analytics:
      reporting_enabled: false
