# Одноразовий Job для виправлення прав на volume Loki (permission denied у tsdb-shipper-*).
# Застосувати: kubectl apply -f manifests/monitoring/loki/job-fix-permissions.yaml
# Після успішного завершення Job: kubectl -n monitoring delete pod -l app=loki
apiVersion: batch/v1
kind: Job
metadata:
  name: loki-fix-permissions
  namespace: monitoring
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 2
  template:
    spec:
      nodeSelector:
        kubernetes.io/hostname: master-node
      restartPolicy: Never
      containers:
        - name: fix
          image: busybox:1.36
          command: ['sh', '-c']
          args:
            - |
              echo "Fixing ownership for UID/GID 10001 (Loki)..."
              # Видалити кеш tsdb-shipper (може містити файли з неправильними правами на OCFS2)
              rm -rf /loki/tsdb-shipper-cache
              rm -rf /loki/tsdb-shipper-active
              mkdir -p /loki/tsdb-shipper-cache /loki/chunks /loki/rules /loki/compactor
              mkdir -p /loki/tsdb-shipper-active/scratch
              chown -R 10001:10001 /loki
              chmod -R 775 /loki
              echo "Done. Listing /loki:"
              ls -la /loki
              ls -la /loki/tsdb-shipper-active 2>/dev/null || true
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: loki-storage
              mountPath: /loki
      volumes:
        - name: loki-storage
          persistentVolumeClaim:
            claimName: loki-data
