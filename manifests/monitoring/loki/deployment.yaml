apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  namespace: monitoring
  labels:
    app: loki
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: loki
  template:
    metadata:
      labels:
        app: loki
    spec:
      dnsPolicy: ClusterFirst
      # Планувати на ноді з DNS/API (як у Prometheus)
      nodeSelector:
        kubernetes.io/hostname: master-node
      securityContext:
        fsGroup: 10001
        runAsUser: 10001
        runAsGroup: 10001
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      initContainers:
      - name: fix-loki-permissions
        image: busybox:1.36
        command: ['sh', '-c']
        args:
          - |
            mkdir -p /loki/tsdb-shipper-cache /loki/chunks /loki/rules /loki/compactor
            rm -rf /loki/tsdb-shipper-active
            mkdir -p /loki/tsdb-shipper-active/scratch
            chown -R 10001:10001 /loki
            chmod -R 775 /loki
        securityContext:
          runAsUser: 0
          runAsGroup: 0
          runAsNonRoot: false
        volumeMounts:
        - name: loki-storage
          mountPath: /loki
      containers:
      - name: loki
        image: grafana/loki:3.0.0
        args:
          - -config.file=/etc/loki/loki.yaml
          - -config.expand-env=true
        ports:
        - containerPort: 3100
          name: http
        - containerPort: 9096
          name: grpc
        volumeMounts:
        - name: loki-config
          mountPath: /etc/loki
          readOnly: true
        - name: loki-storage
          mountPath: /loki
        securityContext:
          runAsUser: 10001
          runAsGroup: 10001
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop:
              - ALL
          seccompProfile:
            type: RuntimeDefault
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        # /ready повертає 503 до повної готовності (WAL, compactor "waiting 10m for ring" тощо)
        livenessProbe:
          httpGet:
            path: /ready
            port: 3100
          initialDelaySeconds: 180
          periodSeconds: 15
          failureThreshold: 45
          timeoutSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 3100
          initialDelaySeconds: 180
          periodSeconds: 15
          failureThreshold: 45
          timeoutSeconds: 10
      volumes:
      - name: loki-config
        configMap:
          name: loki-config
      - name: loki-storage
        persistentVolumeClaim:
          claimName: loki-data
