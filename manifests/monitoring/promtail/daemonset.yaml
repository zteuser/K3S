apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: promtail
  namespace: monitoring
  labels:
    app: promtail
spec:
  selector:
    matchLabels:
      app: promtail
  template:
    metadata:
      labels:
        app: promtail
    spec:
      serviceAccountName: promtail
      # Планувати лише на master-node: на worker-нодах часто "no route to host" до API (10.43.0.1)
      # та Loki; Loki теж на master-node. Щоб збирати логи з усіх нод — виправте мережу між нодами
      # і приберіть nodeSelector.
      ##nodeSelector:
      ##  kubernetes.io/hostname: master-node
      hostNetwork: false
      hostPID: false
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
      containers:
      - name: promtail
        env:
          - name: NODE_NAME
            valueFrom:
              fieldRef:
                fieldPath: spec.nodeName
        # 3.0.0: Kubernetes discovery повертає 0 подів; 2.9.3 теж; використовуємо promtail-static (static_config) для job=promtail
        image: grafana/promtail:2.9.3
        args:
          - -config.file=/etc/promtail/promtail.yaml
          - -config.expand-env=true
        ports:
        - containerPort: 9080
          name: http
        volumeMounts:
        - name: config
          mountPath: /etc/promtail
          readOnly: true
        - name: varlog
          mountPath: /var/log
          readOnly: true
        - name: varrun
          mountPath: /var/run/promtail
        - name: machine-id
          mountPath: /etc/machine-id
          readOnly: true
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "200m"
        securityContext:
          runAsUser: 0
          runAsGroup: 0
          readOnlyRootFilesystem: false
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
      volumes:
      - name: config
        configMap:
          name: promtail-config
      - name: varlog
        hostPath:
          path: /var/log
          type: Directory
      - name: varrun
        hostPath:
          path: /var/run/promtail
          type: DirectoryOrCreate
      - name: machine-id
        hostPath:
          path: /etc/machine-id
          type: File
