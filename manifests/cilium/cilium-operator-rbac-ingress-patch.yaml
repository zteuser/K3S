# Додаткові RBAC для cilium-operator: list/watch Ingress та IngressClass (потрібно для Ingress controller).
# Без цього репліки operator падають з "cannot list resource ingresses" (CrashLoopBackOff).
# Застосувати: kubectl apply -f manifests/cilium/cilium-operator-rbac-ingress-patch.yaml
#
# Після невдалого helm upgrade з values-k8s-vxlan.yaml перевірте configmap cilium-config:
# auto-direct-node-routes має бути "true" при використанні direct-routing-skip-unreachable.
# Якщо залишилось "false": kubectl patch configmap cilium-config -n kube-system --type merge -p '{"data":{"auto-direct-node-routes":"true"}}'
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cilium-operator-ingress
  labels:
    app.kubernetes.io/name: cilium
rules:
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "ingressclasses"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cilium-operator-ingress
  labels:
    app.kubernetes.io/name: cilium
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cilium-operator-ingress
subjects:
  - kind: ServiceAccount
    name: cilium-operator
    namespace: kube-system
