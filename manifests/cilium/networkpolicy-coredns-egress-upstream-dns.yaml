# Дозволити CoreDNS: upstream DNS + Kubernetes API.
# ClusterIP сервісу kubernetes.default залежить від Service CIDR кластера:
#   kubeadm (типово): 10.96.0.1   |   k3s (типово): 10.43.0.1
# Перевірка: kubectl get svc kubernetes -n default -o jsonpath='{.spec.clusterIP}{"\n"}'
# У toCIDR нижче обидва /32 — приберіть зайвий рядок, якщо не використовується.
# Клієнт у поді з’єднується з https://<clusterIP>:443; dataplane часто DNAT на apiserver:6443.
# Додано toEntities: kube-apiserver.
# Застосувати: kubectl apply -f manifests/cilium/networkpolicy-coredns-egress-upstream-dns.yaml
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-coredns-egress-upstream-dns
  namespace: kube-system
spec:
  endpointSelector:
    matchLabels:
      k8s-app: kube-dns
  egress:
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
    - toCIDR:
        - 8.8.8.8/32
        - 1.1.1.1/32
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toCIDR:
        - 10.96.0.1/32   # kubeadm default Service CIDR (перший адрес — API)
        - 10.43.0.1/32   # k3s default Service CIDR (перший адрес — API)
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
