# CRD helm.cattle.io — для видалення orphaned HelmChart (traefik-crd, traefik) з etcd.
# Залишки від k3s після міграції на k8s з Cilium. Без цього CRD garbage-collector
# не може обробити об'єкти → "unable to get REST mapping for helm.cattle.io/v1/HelmChart"
# Джерело: k3s-io/helm-controller
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: helmcharts.helm.cattle.io
spec:
  group: helm.cattle.io
  names:
    kind: HelmChart
    listKind: HelmChartList
    plural: helmcharts
    shortNames:
    - hc
    singular: helmchart
  scope: Namespaced
  versions:
  - name: v1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        x-kubernetes-preserve-unknown-fields: true
