apiVersion: apps/v1
kind: Deployment
metadata:
  name: portainer
  namespace: portainer
  labels:
    app: portainer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: portainer
  template:
    metadata:
      labels:
        app: portainer
    spec:
      serviceAccountName: portainer
      dnsPolicy: ClusterFirst
      # Запускати на master-node: на work-node поди не досягають CoreDNS (10.43.0.10:53), тому "local" environment Down.
      # OCFS2 (portainer-data) є на master-node та work-node. Щоб дозволити Portainer на обох нодах — спочатку виправити ClusterIP/DNS на work-node (FIX_CLUSTERIP_ACCESS_FROM_ALL_NODES.md), потім замінити nodeSelector на nodeAffinity з values: [master-node, work-node].
      nodeSelector:
        kubernetes.io/hostname: master-node
      containers:
      - name: portainer
        image: portainer/portainer-ce:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 9000
          name: http
          protocol: TCP
        - containerPort: 9443
          name: https
          protocol: TCP
        env:
        - name: KUBERNETES_ENABLED
          value: "true"
        volumeMounts:
        - name: portainer-data
          mountPath: /data
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
      volumes:
      - name: portainer-data
        persistentVolumeClaim:
          claimName: portainer-data
