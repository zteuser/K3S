# Скидання пароля адміна Portainer (офіційний helper).
# Перед запуском: scale down Portainer, щоб PVC був вільний для монтування.
# Деталі: https://docs.portainer.io/advanced/reset-admin
#
# 1) kubectl scale deploy portainer --replicas=0 -n portainer
# 2) kubectl apply -f manifests/portainer/job-reset-admin-password.yaml
# 3) kubectl logs -f job/portainer-reset-admin -n portainer   # дочекатися виводу з новим паролем
# 4) kubectl scale deploy portainer --replicas=1 -n portainer
# 5) kubectl delete job portainer-reset-admin -n portainer
#
apiVersion: batch/v1
kind: Job
metadata:
  name: portainer-reset-admin
  namespace: portainer
spec:
  ttlSecondsAfterFinished: 300
  template:
    spec:
      # Той самий nodeSelector, що й Portainer — PVC ocfs2 на master-node
      nodeSelector:
        kubernetes.io/hostname: master-node
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      restartPolicy: Never
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: portainer-data
      containers:
        - name: passreset
          image: portainer/helper-reset-password
          # Опційно: задати простий пароль (без []$<> тощо), щоб уникнути проблем з копіюванням/браузером.
          # Після входу змініть його в UI: User settings → Password.
          args:
            - "--password=PortainerAdmin1"
          volumeMounts:
            - mountPath: /data
              name: data
